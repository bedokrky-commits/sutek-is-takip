<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10182b">
  <title>SUTEK İş Takip</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#101828;
    min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid #e6e9ef;
    border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(16,24,40,.09);text-align:center}.logo{width:74px;height:74px;
    border-radius:18px;background:#4652d6;color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-weight:800;font-size:24px}
    h1{font-size:22px;margin:0 0 9px}p{font-size:13px;line-height:1.55;color:#667085;margin:0 0 18px}button{border:0;
    background:#4652d6;color:#fff;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">S</div>
    <h1>İnternet bağlantısı yok</h1>
    <p>SUTEK İş Takip verileri güvenlik nedeniyle çevrimdışı saklanmaz. Bağlantı geri geldiğinde uygulamayı yeniden deneyin.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
  </main>
</body>
</html>
